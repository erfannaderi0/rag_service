services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: rag_app
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    volumes:
      - C:/Users/ERFAN/.cache/huggingface:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy

  ingest:
    build: .
    container_name: rag_ingest
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    volumes:
      - C:/Users/ERFAN/.cache/huggingface:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.ingestion.ingest", "data/documents"]
    profiles:
      - tools   # doesn't start with "docker compose up"; run on demand, see README

volumes:
  pgdata:
  hf_cache:
