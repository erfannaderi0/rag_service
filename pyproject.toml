[project]
name = "rag-service"
version = "0.1.0"
description = "RAG service: PDF ingestion, pgvector retrieval, and Groq-based generation"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "python-dotenv==1.0.1",
    "psycopg2-binary==2.9.10",
    "pgvector==0.3.6",
    "groq>=0.30.0",
    "tenacity==9.0.0",
    "pymupdf==1.25.1",
    "tiktoken==0.8.0",
    "FlagEmbedding==1.3.4",
    "transformers==4.44.2",
]

[project.optional-dependencies]
eval = [
    "ragas",
    "langchain-openai",
    "pandas",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
